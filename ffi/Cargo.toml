[package]
name = "hudnav-ffi"
version = "0.1.0"
edition = "2021"
description = "UniFFI bridge exposing hudnav-core to Swift"

[workspace]

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "hudnav_ffi"

[dependencies]
hudnav-core = { path = "../core" }
serde_json = "1"
uniffi = { version = "0.29", features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# XcodeGen spec. The .xcodeproj is generated by scripts/ios-build.sh and not committed.
name: HudNav
options:
  bundleIdPrefix: com.hallya
  deploymentTarget:
    iOS: "17.0"
targets:
  HudNav:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Generated
        includes: ["*.swift", "bluelink_constants.json"]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: HUD Nav
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hallya.ioniqhudnav
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Generated
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Generated
        # The static archive by path: `-lhudnav_ffi` would pick the cdylib that
        # sits next to it, and the app would crash at launch (dylib not in the bundle).
        OTHER_LDFLAGS: $(PROJECT_DIR)/../ffi/target/aarch64-apple-ios/release/libhudnav_ffi.a
        ENABLE_BITCODE: NO
